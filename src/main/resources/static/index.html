<!DOCTYPE html>
<html>
<head>
    <title>Network Traffic Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
        }

        .buttons {
            text-align: center;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .card {
            background: white;
            padding: 20px;
            width: 180px;
            text-align: center;
            border-radius: 8px;
        }

        .card h2 {
            margin: 5px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Network Traffic Analyzer</h1>

    <div class="buttons">
        <button onclick="startCapture()">Start Capture</button>
        <button onclick="stopCapture()">Stop Capture</button>
    </div>

    <div class="stats">

        <div class="card">
            <h3>Total Packets</h3>
            <h2 id="totalPackets">0</h2>
        </div>

        <div class="card">
            <h3>TCP Packets</h3>
            <h2 id="tcpPackets">0</h2>
        </div>

        <div class="card">
            <h3>UDP Packets</h3>
            <h2 id="udpPackets">0</h2>
        </div>

        <div class="card">
            <h3>Total Bytes</h3>
            <h2 id="totalBytes">0</h2>
        </div>

    </div>
    <h2>Protocol Statistics</h2>

<div style="width: 500px; margin: 30px auto;">
    <canvas id="protocolChart"></canvas>
</div>


    <h2>Packet Details</h2>

<div id="packetDetails" style="
    background: white;
    padding: 20px;
    margin-bottom: 30px;
    border-radius: 8px;
">
    Click a packet from the table to view details.
</div>
<div style="margin-bottom: 15px;">
    <input
        type="text"
        id="packetFilter"
        placeholder="Search IP, protocol, or port..."
        onkeyup="filterPackets()"
        style="
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        "
    >
</div>
    <h2>Live Packets</h2>

    <table>

        <thead>
            <tr>
                <th>Time</th>
                <th>Source IP</th>
                <th>Destination IP</th>
                <th>Protocol</th>
                <th>Source Port</th>
                <th>Destination Port</th>
                <th>Packet Size</th>
            </tr>
        </thead>

        <tbody id="packetTable">
        </tbody>

    </table>

    <script>

        let socket;
        let protocolChart;

function createProtocolChart() {

    let ctx = document
        .getElementById("protocolChart")
        .getContext("2d");

    protocolChart = new Chart(ctx, {
        type: "pie",

        data: {
            labels: ["TCP", "UDP", "Other"],

            datasets: [{
                data: [0, 0, 0]
            }]
        },

        options: {
            responsive: true
        }
    });
}

        function startCapture() {

    if (socket && socket.readyState === WebSocket.OPEN) {
        return;
    }

    document.getElementById("packetTable").innerHTML = "";

    fetch("/api/capture/start");

    connectWebSocket();
}

        function stopCapture() {

    fetch("/api/capture/stop");

    if (socket) {
        socket.close();
        socket = null;
    }
}

        function connectWebSocket() {

            socket = new WebSocket(
                "ws://" + window.location.host + "/ws/packets"
            );

            socket.onopen = function() {
                console.log("WebSocket connected");
            };

            socket.onmessage = function(event) {

                let packet = JSON.parse(event.data);

                addPacket(packet);

                updateStats();
            };

            socket.onclose = function() {
                console.log("WebSocket disconnected");
            };
        }

        function addPacket(packet) {

            let table =
                document.getElementById("packetTable");

            let row = table.insertRow(0);
            row.onclick = function() {
    showPacketDetails(packet);
};

            row.insertCell(0).innerText =
    packet.timestamp;

row.insertCell(1).innerText =
    packet.sourceIp;

row.insertCell(2).innerText =
    packet.destinationIp;

row.insertCell(3).innerText =
    packet.protocol;

row.insertCell(4).innerText =
    packet.sourcePort;

row.insertCell(5).innerText =
    packet.destinationPort;

row.insertCell(6).innerText =
    packet.packetSize;
        }
        function filterPackets() {

    let input =
        document.getElementById("packetFilter")
            .value
            .toLowerCase();

    let table =
        document.getElementById("packetTable");

    let rows = table.getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {

        let text =
            rows[i].innerText.toLowerCase();

        if (text.includes(input)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}

        function showPacketDetails(packet) {

    document.getElementById("packetDetails").innerHTML =

        "<b>Source IP:</b> " + packet.sourceIp + "<br>" +
        "<b>Destination IP:</b> " + packet.destinationIp + "<br>" +
        "<b>Protocol:</b> " + packet.protocol + "<br>" +
        "<b>Source Port:</b> " + packet.sourcePort + "<br>" +
        "<b>Destination Port:</b> " + packet.destinationPort + "<br>" +
        "<b>Packet Size:</b> " + packet.packetSize + " bytes";
}

        function updateStats() {

            fetch("/api/stats")
                .then(response => response.json())
                .then(data => {

                    document.getElementById("totalPackets")
                        .innerText = data.totalPackets;

                    document.getElementById("tcpPackets")
                        .innerText = data.tcpPackets;

                    document.getElementById("udpPackets")
                        .innerText = data.udpPackets;

                    document.getElementById("totalBytes")
                        .innerText = data.totalBytes;
                });
                let otherPackets =
    data.totalPackets -
    data.tcpPackets -
    data.udpPackets;

protocolChart.data.datasets[0].data = [
    data.tcpPackets,
    data.udpPackets,
    otherPackets
];

protocolChart.update();
        }

        createProtocolChart();
    </script>

</body>
</html>
